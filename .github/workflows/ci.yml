name: CI

# tobor-kit service (mix project root: elixir/, Dockerfile + vendored chart at
# repo root). PRs run mix test + docker build (no push). Push to `main`
# (manually merged release branch) builds+pushes a sha-* image and bumps the chart
# tag so ArgoCD can sync. v* tags publish release-tagged images.
# Never run the chart bump by hand.

on:
  push:
    branches: [develop, main, stage]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run all regression checks
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ops.noizu.com
  IMAGE: ops.noizu.com/tobor-kit/backend

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      lit: ${{ steps.scope.outputs.lit }}
      browser-files: ${{ steps.scope.outputs.browserFiles }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select affected product
        id: scope
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_FULL: ${{ inputs.full == true }}
        run: node --test scripts/ci-scope.test.mjs && node scripts/ci-scope.mjs

  test:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elixir
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.1"
          otp-version: "29"
      - uses: actions/cache@v4
        with:
          path: |
            elixir/deps
            elixir/_build
          key: mix-${{ runner.os }}-otp29-elixir1.20-${{ hashFiles('elixir/mix.lock') }}
          restore-keys: mix-${{ runner.os }}-otp29-elixir1.20-
      - run: mix deps.get
      - run: mix test

  docker-build:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: ${{ env.IMAGE }}:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

  build-push:
    needs: [test]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

  release:
    needs: [test]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

  bump-chart:
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Bump image tag
        run: |
          SHORT=${GITHUB_SHA::7}
          sed -i -E "s|(tag: )\"sha-[^\"]*\"|\1\"sha-${SHORT}\"|" helm/tobor-kit/values.yaml
      - name: Commit & push
        run: |
          git config user.name "tobor-kit-ci"
          git config user.email "ci@noizu.com"
          git add helm/tobor-kit/values.yaml
          git diff --cached --quiet && exit 0
          git commit -m "ci: deploy sha-${GITHUB_SHA::7} [skip ci]"
          git pull --rebase origin ${{ github.ref_name }}
          git push
  ci-timing:
    # PR-run timing tracker (fleet standard). Warn-only: never blocks.
    # Thresholds are repo/org Variables PR_STEP_MAX_MINUTES / PR_RUN_MAX_MINUTES, defaults 4/7.
    needs: [test]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Track timing thresholds
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_STARTED_AT: ${{ github.run_started_at }}
          STEP_MAX_MIN: ${{ vars.PR_STEP_MAX_MINUTES || '4' }}
          RUN_MAX_MIN: ${{ vars.PR_RUN_MAX_MINUTES || '7' }}
        run: |
          set -euo pipefail
          SUMMARY="$GITHUB_STEP_SUMMARY"
          jobs_json=""
          for i in 1 2 3; do
            jobs_json=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100") && break
            sleep 5
          done
          [ -n "$jobs_json" ] || { echo "::warning title=CI timing::could not fetch run jobs"; exit 0; }
          {
            echo "## CI timing (thresholds: step ${STEP_MAX_MIN}m / run ${RUN_MAX_MIN}m)"
            echo
            echo "| job | step | duration | status |"
            echo "|---|---|---|---|"
          } >> "$SUMMARY"
          flagged=0
          steps_sum=0
          while IFS=$'\t' read -r job step start end; do
            [ -n "$job" ] || continue
            s=$(date -d "$start" +%s); e=$(date -d "$end" +%s)
            dur=$((e - s)); thr=$((STEP_MAX_MIN * 60))
            steps_sum=$((steps_sum + dur))
            if [ "$dur" -gt "$thr" ]; then
              flagged=$((flagged + 1))
              echo "::warning title=CI timing::\"$step\" (job: $job) took $((dur / 60))m$((dur % 60))s — over the ${STEP_MAX_MIN}m step threshold"
              echo "| \`$job\` | \`$step\` | $((dur / 60))m$((dur % 60))s | ⚠️ over ${STEP_MAX_MIN}m |" >> "$SUMMARY"
            else
              echo "| \`$job\` | \`$step\` | $((dur / 60))m$((dur % 60))s | ok |" >> "$SUMMARY"
            fi
          done < <(echo "$jobs_json" | jq -r '
            .jobs[] | select(.name | test("^test$")) | .name as $job |
            .steps[] | select(.status == "completed" and .conclusion != "skipped" and .conclusion != null) |
            [$job, .name, .started_at, .completed_at] | @tsv')
          start=$(date -d "$RUN_STARTED_AT" +%s); now=$(date +%s)
          wall=$((now - start)); run_thr=$((RUN_MAX_MIN * 60))
          echo
          echo "| **steps sum** | test jobs, work only | $((steps_sum / 60))m$((steps_sum % 60))s | $( [ "$steps_sum" -gt "$run_thr" ] && echo "⚠️ over ${RUN_MAX_MIN}m" || echo ok) |" >> "$SUMMARY"
          echo "| **wall clock** | queue + work | $((wall / 60))m$((wall % 60))s | info |" >> "$SUMMARY"
          if [ "$steps_sum" -gt "$run_thr" ]; then
            echo "::warning title=CI timing::acceptance steps sum to $((steps_sum / 60))m$((steps_sum % 60))s — over the ${RUN_MAX_MIN}m run threshold (wall clock: $((wall / 60))m)"
          fi
          echo; echo "_${flagged} step(s) over threshold._" >> "$SUMMARY"
