name: Publish Lit components

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run all regression checks
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-lit-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      lit: ${{ steps.scope.outputs.lit }}
      browser-files: ${{ steps.scope.outputs.browserFiles }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select affected product
        id: scope
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_FULL: ${{ inputs.full == true }}
        run: node --test scripts/ci-scope.test.mjs && node scripts/ci-scope.mjs

  build:
    needs: changes
    if: needs.changes.outputs.lit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install boto3==1.40.20
      - name: Inspect storage routing on manual runs
        if: github.event_name == 'workflow_dispatch'
        run: |
          HEADER=$(mktemp)
          trap 'rm -f "$HEADER"' EXIT
          curl --silent --show-error --max-time 15 --dump-header "$HEADER" --output /dev/null "https://minio.noizu.com/cdn-derobot-is/tobor-kit/sha-$GITHUB_SHA/manifest.json"
          python3 - "$HEADER" <<'PYCODE'
          import sys, urllib.parse
          for line in open(sys.argv[1]):
              if line.lower().startswith('location:'):
                  u = urllib.parse.urlsplit(line.split(':', 1)[1].strip())
                  print('Redirect target:', u.scheme, u.netloc, u.path)
              elif line.lower().startswith(('http/', 'server:', 'cf-ray:')):
                  print(line.strip())
          PYCODE
      - run: python3 scripts/test-publish-lit-cdn.py && python3 scripts/test-cdn-s3.py
      - name: Validate signed storage access on manual runs
        if: github.event_name == 'workflow_dispatch'
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CDN_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CDN_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          ERROR=$(mktemp)
          OBJECT=$(mktemp)
          trap 'rm -f "$ERROR" "$OBJECT"' EXIT
          if python3 scripts/cdn-s3.py --endpoint-url https://minio.noizu.com s3api get-object --bucket cdn-derobot-is --key "tobor-kit/sha-$GITHUB_SHA/manifest.json" "$OBJECT" >/dev/null 2>"$ERROR"; then
            echo 'Signed storage access passed; release exists.'
          elif grep -Eq '\(NoSuchKey\)|\(404\)' "$ERROR"; then
            echo 'Signed storage access passed; release is new.'
          else
            cat "$ERROR" >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint && npm run build && npm run test:bundle && npm run test:react
        working-directory: web
      - name: Relevant browser regression
        if: inputs.full == true || (github.event_name == 'pull_request' && !(github.base_ref == 'main' && github.head_ref == 'develop'))
        working-directory: web
        env:
          BROWSER_FILES: ${{ needs.changes.outputs.browser-files }}
        run: npm run test:browser -- --files "$BROWSER_FILES"
      - name: Accessible styleguide field regression
        working-directory: web
        run: npm run test:browser -- --files 'src/components/styleguide/test/unit/*.test.ts'
      - name: Prepare browser modules and release manifest
        run: node scripts/prepare-cdn.mjs "$GITHUB_SHA"
      - name: Smoke test native CDN imports
        run: node scripts/smoke-cdn.mjs
      - name: Every CDN component entry self-registers its tag
        run: node scripts/smoke-cdn-registration.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: lit-cdn-${{ github.sha }}
          path: web/cdn-dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: lit-cdn-${{ github.sha }}
          path: web/cdn-dist/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install boto3==1.40.20
      - name: Upload immutable Lit release and update latest manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CDN_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CDN_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: 'true'
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: bash scripts/publish-lit-cdn.sh "$GITHUB_SHA"
