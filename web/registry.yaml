      - disclosure
      - disclosure-button
      - disclosure-panel
    cy_prefix: faq
    cy:
      - faq.list
      - faq.item
      - faq.trigger
    events: [faq-toggle]
    notes: >
      Wrap slotted native <details>/<summary>. mode=many (default) or one
      (accordion). Do not invent a JSON items attribute. Light DOM.

  noizu-footer-brand:
    file: src/components/footer-brand/noizu-footer-brand.ts
    attrs: [href, target, brand, prefix, suffix, theme, palette, align]
    slots: []
    classes: []
    cy_prefix: footer-brand
    cy:
      - footer-brand-root
      - footer-brand-link
    events: []
    notes: >
      Shadow DOM attribution line "A The Robot Lives Joint". Presentational
      only — no events, no slots, no backend. theme=dark|light|auto (auto
      follows prefers-color-scheme). palette=default|mono|accent (token
      values only). Empty prefix/suffix suppresses that piece and its
      spacing. Explicit --noizu-footer-brand-* overrides beat presets.

  noizu-auth:
    file: src/components/auth/noizu-auth.ts
    attrs: [mode, flow, open, endpoint, transport, api-base, with-credentials, development, dev-port, invite-token-mode, invite-fallback-url, invite-required-url, custom-method]
    slots: [avatar, brand, footer, trigger, method, method-login, method-signup, method-register]
    classes: [custom-method, auth-content, auth-shell, auth-dialog, auth-card, auth-avatar, auth-brand, auth-title, auth-description, auth-methods, auth-provider, auth-form, field-group, field-label, field-input, btn, auth-status, auth-footer, auth-close, dropdown-wrap, dropdown-panel, auth-trigger, merge-required]
    cy_prefix: auth
    cy:
      - auth-dropdown-trigger
      - auth-dropdown-panel
      - pipe-list
      - pipe-email-password
      - pipe-mobile-password
      - pipe-email-otp
      - pipe-mobile-otp
      - pipe-google
      - pipe-authentik
      - pipe-github
      - pipe-form
      - pipe-submit
      - mobile-phone-input
      - merge-required
      - merge-pipe-list
      - merge-pipe-option
      - merge-confirm
      - merge-confirm-form
      - merge-confirm-submit
      - sms-region-notice
      - custom-method
      - invite_token-input
      - invite-token-hint
    events: [noizu-auth-flow-change, auth-success, auth-error, auth-close, auth-redirect, noizu-auth-submit, noizu-auth-success, noizu-auth-error, noizu-auth-merge-required, noizu-auth-merge-confirmed, noizu-auth-otp-requested, noizu-auth-sms-region-unsupported, noizu-auth-invite-required]
    notes: >
      `custom-method` (or pipes = ['custom']) renders host-slotted method-login /
      method-signup / method panes inside the card chrome, makes no network
      request, mounts no human-verify element, and is finished by the host via
      complete(detail) / fail(error).
      Standard portfolio authentication, configured methods and copy, same-host
      WebSocket adapter; semantic Shadow DOM parts and theme tokens. Optional
      `mode=dropdown` (anchored, non-modal popover; trigger slot) and a
      data-driven `pipes` property (email_password, mobile_password,
      email_otp, mobile_otp, google, authentik, github — reuses noizu-phone-input for
      the mobile pipes) layer additively on top of the legacy options-driven
      email flow, which is unchanged when `pipes` is unset. Merge-flow states
      (`merge_required` / `merge_confirming`) surface only masked identifiers
      for an account's existing pipes, per the backend contract. Optional
      `smsRegions` property ({supported: string[], message?}) gates the mobile
      pipes to SMS-capable regions (ISO-3166 alpha-2, derived from
      noizu-phone-input's own country selection); absent = no gating. A
      server `sms_region_unsupported` error always overrides the client-side
      check. Two selectable transports behind one internal contract:
      `transport` unset (default) keeps the same-host WebSocket at `endpoint`
      exactly as before; `transport="rest"` speaks JSON `POST {api-base}/auth/*`
      with Bearer-token sessions (409 merge_required and 422
      sms_region_unsupported map onto the same internal states). REST mode omits
      cookies unless `with-credentials` is set, and emits the session on
      auth-success / noizu-auth-success — the element never stores tokens.
      An explicit invite-token-mode="optional" opts into the invite
      interstitial: a hint under the field, and a signup answered with
      invite_required (error code, or user.invite_required on success) emits
      the cancelable noizu-auth-invite-required and navigates to
      invite-required-url (default /auth/invite-required; "" = off) instead
      of rendering an error. The unset default is unchanged.

  noizu-invite-gate:
    file: src/components/invite-gate/noizu-invite-gate.ts
    attrs: [endpoint, continue-url, profile-url, settings-url, sign-out-url, brand, email, token, with-credentials, embedded]
    slots: [brand, footer]
    classes: []
    cy_prefix: invite
    cy:
      - invite-required
      - invite-title
      - invite-description
      - invite-redeem-form
      - invite-code-input
      - invite-redeem-submit
      - invite-error
      - invite-status
      - invite-profile-link
      - invite-settings-link
      - invite-sign-out
    events: [noizu-invite-redeemed, noizu-invite-error, noizu-invite-sign-out]
    notes: >
      Invite interstitial card for an account held by the invite gate
      (403 invite_required). POSTs {token} to a same-origin endpoint
      (default /api/v1/invites/redeem; Bearer via the accessToken property,
      or a host redeemer hook), then emits the cancelable
      noizu-invite-redeemed and navigates to continue-url. Error states:
      invalid, expired, used, rate_limited, unauthenticated, failure.
      Sibling module invite-required.js (no element) holds the 403 helpers
      handleInviteRequired / withInviteGate / userNeedsInvite.

