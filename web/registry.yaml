# @noizu/lit name directory — tags, existing styleguide classes, slots, data-cy, event names.
# Not an API spec. No payloads. String attributes only.
# Tracks may not invent tags or CSS classes not listed here.

elements:
  noizu-waitlist:
    file: src/components/waitlist/noizu-waitlist.ts
    attrs: [slug, service, list, api, source]
    attr_aliases:
      slug: [data-foryou-slug]
      service: [data-foryou-service]
      list: [data-foryou-list]
      api: [data-foryou-api]
      source: [data-foryou-source]
    slots: [default]
    classes:
      - field-group
      - field-label
      - field-input
      - field-select
      - field-textarea
      - btn
      - success
      - danger
    cy_prefix: waitlist
    cy:
      - waitlist.form
      - waitlist.email
      - waitlist.submit
      - waitlist.status
    events: [waitlist-success, waitlist-error]
    notes: >
      Port foryou public/widget.js (GET list manifest, POST signups, honeypot
      company_website, credentials omit, always-202). Default api
      https://foryou.therobotlives.com. Fallback field = email when manifest
      has no attributes. Light DOM. Host JWT/session is out of scope.

  noizu-cookie-consent:
    file: src/components/cookie/noizu-cookie-consent.ts
    attrs: [storage-key, mode]
    slots: []
    classes:
      - card
      - btn
      - btn-outline
      - btn-sm
      - hui
      - checkbox-wrap
    cy_prefix: cookie
    cy:
      - cookie.banner
      - cookie.accept-all
      - cookie.reject-optional
      - cookie.save
      - cookie.category
    events: [cookie-consent-change]
    event_aliases: [start-app:cookie-consent-change]
    notes: >
      Island: localStorage + window events. Default storage-key
      start-app.cookie-consent.v1. mode=categories|essential-all.
      Shape {version:1, categories:{necessary,analytics,marketing,preferences},
      acceptedAt, updatedAt}. Host keeps Phoenix session, JWT PUT
      /api/v1/consent/cookies, /session-cookie-required routing.
      Listens for cookie-settings-open to re-open the panel.

  noizu-cookie-settings:
    file: src/components/cookie/noizu-cookie-settings.ts
    attrs: []
    slots: [default]
    classes:
      - btn
      - btn-outline
      - btn-sm
    cy_prefix: cookie
    cy:
      - cookie.settings
    events: [cookie-settings-open]
    notes: >
      Button. Click dispatches cookie-settings-open (bubbles, composed).
      Default slot copy "Cookie Settings". No import of the banner.

  noizu-faq:
    file: src/components/faq/noizu-faq.ts
