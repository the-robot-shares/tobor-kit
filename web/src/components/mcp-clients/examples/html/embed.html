<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tobor-mcp-clients</title>
    <script type="module" src="https://cdn.derobot.is/tobor-kit/latest/components/mcp-clients/tobor-mcp-clients.js"></script>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 48rem; margin: 2rem auto; padding: 0 1rem; background: #12131a; color: #e8e9f0; }
    </style>
  </head>
  <body>
    <div class="demo-frame">
      <tobor-mcp-clients></tobor-mcp-clients>
    </div>
    <pre id="log"></pre>
    <script type="module">
      const el = document.querySelector('tobor-mcp-clients');
      const log = document.querySelector('#log');
      // Host-owned: clients is a JS property, not an HTML attribute.
      el.clients = [
        {id: 'github', name: 'GitHub', status: 'disconnected', auth: 'oauth'},
        {id: 'search', name: 'Search', status: 'connected', auth: 'api-key'},
      ];
      el.addEventListener('client-authorize', (event) => {
        // Host starts OAuth (redirect) or collects an API key. Kit does not redirect.
        log.textContent = JSON.stringify({authorize: event.detail});
      });
      el.addEventListener('client-revoke', (event) => {
        log.textContent = JSON.stringify({revoke: event.detail});
      });
    </script>
  </body>
</html>
