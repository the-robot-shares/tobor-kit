      // tag -> built module (side-effect registers the custom element).
      const MODULES = {

        'noizu-plan-compare': '/dist/components/plan-compare/noizu-plan-compare.js',

        'tobor-user-card': '/dist/components/party-card/user-card.js',
        'tobor-chat-thread': '/dist/components/chat-thread/chat-thread.js',
        'tobor-persona-card': '/dist/components/persona/persona-card.js',
        'tobor-persona-picker': '/dist/components/persona/persona-picker.js',
        'tobor-asset-view': '/dist/components/asset/asset-view.js',
        'tobor-asset-editor': '/dist/components/asset/asset-editor.js',
        'tobor-artifact-view': '/dist/components/artifact/tobor-artifact-view.js',

        'tobor-prompt-history': '/dist/components/prompt/tobor-prompt-history.js',

      const loaded = new Map();
      const root = () => document.getElementById('mount-root');

      window.__events = [];
      let current = null;

      async function ensureModule(tag) {
        await window.__importMapReady;
        const path = MODULES[tag];
        if (!path) throw new Error(`no module registered for tag ${tag}`);
        if (!loaded.has(path)) loaded.set(path, import(path));
        return loaded.get(path);

      // Record every CustomEvent the mounted element dispatches (name + detail).
      function instrument(el) {
        const native = el.dispatchEvent.bind(el);
        el.dispatchEvent = (event) => {
          if (event instanceof CustomEvent) {
            window.__events.push({type: event.type, detail: event.detail ? JSON.parse(JSON.stringify(event.detail)) : null});
          }
          return native(event);
        };
      }

      window.mount = async (tag, attrs = {}, props = {}, slotsHTML = '') => {
        try {
          await ensureModule(tag);
          window.unmount();
          const el = document.createElement(tag);
          instrument(el);
          for (const [name, value] of Object.entries(attrs)) el.setAttribute(name, String(value));
          for (const [name, value] of Object.entries(props)) el[name] = value;
          if (slotsHTML) {
            const tpl = document.createElement('template');
            tpl.innerHTML = slotsHTML;
            while (tpl.content.firstChild) el.appendChild(tpl.content.firstChild);
          }
          root().appendChild(el);
          current = el;
          window.__mountError = null;
          return true;
        } catch (err) {
          window.__mountError = String(err);
          throw err;
        }

      window.unmount = () => {
        if (current) {
          current.remove();
          current = null;
        }
