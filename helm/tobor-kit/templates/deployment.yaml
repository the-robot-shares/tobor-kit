apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tobor-kit.fullname" . }}
  labels:
    {{- include "tobor-kit.labels" . | nindent 4 }}
  {{- if .Values.secrets.infisical.enabled }}
  annotations:
    secrets.infisical.com/auto-reload: "true"
  {{- end }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "tobor-kit.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tobor-kit.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: app
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.service.port }}
          protocol: TCP
        env:
        - name: TOBOR_KIT_HTTP_ENABLED
          value: "true"
        - name: TOBOR_KIT_HTTP_PORT
          value: {{ .Values.service.port | quote }}
        - name: TOBOR_KIT_SERVICE_NAME
          value: {{ include "tobor-kit.fullname" . | quote }}
        {{- if .Values.guide.bundlePath }}
        - name: TOBOR_KIT_GUIDE_PATH
          value: {{ .Values.guide.bundlePath | quote }}
        {{- end }}
        {{- if .Values.oidc.issuer }}
        - name: TOBOR_KIT_OIDC_ISSUER
          value: {{ .Values.oidc.issuer | quote }}
        - name: TOBOR_KIT_OIDC_REDIRECT_URI
          value: {{ .Values.oidc.redirectUri | quote }}
        - name: TOBOR_KIT_OIDC_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.name }}
              key: TOBOR_KIT_OIDC_CLIENT_ID
              optional: true
        {{- end }}
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.name }}
              key: OPENAI_API_KEY
              optional: true
        {{- if .Values.otel.enabled }}
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: {{ .Values.otel.collectorEndpoint | quote }}
        {{- else }}
        - name: OTEL_TRACES_EXPORTER
          value: "none"
        {{- end }}
        {{- with .Values.extraEnv }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /api/tobor-kit/healthz
            port: {{ .Values.service.port }}
          initialDelaySeconds: 15
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/tobor-kit/healthz
            port: {{ .Values.service.port }}
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          runAsNonRoot: true
          # Numeric UID required: the image's `nobody` is non-numeric, which
          # fails the k8s runAsNonRoot verification (CreateContainerConfigError).
          runAsUser: 65534
          runAsGroup: 65534
      restartPolicy: Always
