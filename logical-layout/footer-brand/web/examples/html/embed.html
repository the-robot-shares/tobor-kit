<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>noizu-footer-brand</title>
    <script type="importmap">
      {
        "imports": {
          "lit": "https://cdn.derobot.is/tobor-kit/latest/vendor/lit.js",
          "lit/decorators.js": "https://cdn.derobot.is/tobor-kit/latest/vendor/lit-decorators.js"
        }
      }
    </script>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 2rem;
        background: #12131a;
        color: #e8e9f0;
      }
      footer {
        margin-top: 3rem;
        display: grid;
        gap: 1rem;
      }
    </style>
  </head>
  <body>
    <footer>
      <noizu-footer-brand></noizu-footer-brand>
      <noizu-footer-brand palette="mono"></noizu-footer-brand>
      <noizu-footer-brand
        prefix="Built by"
        suffix=""
        brand="Noizu Labs"
        href="https://noizu.com"
        target="_blank"
        palette="accent"
        align="end"
      ></noizu-footer-brand>
    </footer>
    <script type="module">
      import 'https://cdn.derobot.is/tobor-kit/latest/components/footer-brand/noizu-footer-brand.js';

      // The whole API is attributes + CSS custom properties. No events, no backend.
      // Host-owned: the link destination and any analytics around it.
      //
      // Explicit overrides beat theme/palette presets, from any ancestor:
      //   --noizu-footer-brand-brand-color
      //   --noizu-footer-brand-fg
      //   --noizu-footer-brand-brand-font / -font / -size / -letter-spacing / -padding
    </script>
  </body>
</html>
