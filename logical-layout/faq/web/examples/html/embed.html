<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>noizu-faq embed</title>
    <!-- CDN latest rewrites Lit to vendor/ — no import map required. -->
    <script type="module" src="https://cdn.derobot.is/tobor-kit/latest/components/faq/noizu-faq.js"></script>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
      /* Host styleguide owns .hui / .disclosure*; demo fallback only. */
      .disclosure { border-bottom: 1px solid #ddd; padding: 0.5rem 0; }
      .disclosure-button { cursor: pointer; font-weight: 600; }
    </style>
  </head>
  <body>
    <h1>FAQ</h1>
    <noizu-faq mode="many">
      <details>
        <summary>What is this?</summary>
        <p>A Light DOM island that decorates slotted native details/summary.</p>
      </details>
      <details>
        <summary>Does the host need a backend?</summary>
        <p>No. The island is host-only markup.</p>
      </details>
      <details>
        <summary>Can only one item stay open?</summary>
        <p>Set <code>mode="one"</code> for accordion behavior.</p>
      </details>
    </noizu-faq>
    <script type="module">
      const faq = document.querySelector('noizu-faq');
      faq?.addEventListener('faq-toggle', (event) => {
        // Host-owned: persist or analytics. The island does not POST this.
        console.log('faq-toggle', event.detail);
      });
    </script>
  </body>
</html>
