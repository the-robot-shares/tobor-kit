<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tobor-mcp-config</title>
    <script type="module" src="https://cdn.derobot.is/tobor-kit/latest/components/mcp-config/tobor-mcp-config.js"></script>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 48rem; margin: 2rem auto; padding: 0 1rem; background: #12131a; color: #e8e9f0; }
    </style>
  </head>
  <body>
    <div class="demo-frame">
      <tobor-mcp-config url="https://mcp.example.test/mcp" transport="http"></tobor-mcp-config>
    </div>
    <pre id="log"></pre>
    <script type="module">
      const el = document.querySelector('tobor-mcp-config');
      const log = document.querySelector('#log');
      el.addEventListener('config-change', (event) => {
        // Host validates & persists. Do not log secrets (there should be none).
        log.textContent = JSON.stringify(event.detail);
      });
    </script>
  </body>
</html>
